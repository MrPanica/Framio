name: Build Framio

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match VERSION '$version'. Expected '$expectedTag'."
          }

      - name: Compile Python sources
        shell: pwsh
        run: |
          $files = @(
            'main.py',
            'config.py',
            'ui/overlay.py',
            'ui/settings_dialog.py',
            'ui/toolbars.py',
            'ui/recording_window.py',
            'models/shapes.py',
            'recorder/capture_worker.py',
            'utils/capture_mask.py',
            'utils/i18n.py',
            'utils/image_search.py'
          )
          python -m py_compile $files

      - name: Run component tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u tests/test_components.py

      - name: Build portable application
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build-ci Framio.spec

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/Framio/Framio.exe')) { throw 'Framio.exe was not produced' }
          if (Get-ChildItem -LiteralPath 'dist/Framio/_internal' -Filter 'icu*.dll' -ErrorAction SilentlyContinue) { throw 'Conflicting ICU DLL found in portable bundle' }

      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path 'dist/Framio/*' -DestinationPath 'dist/Framio-windows.zip' -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Framio-windows
          path: dist/Framio-windows.zip
          if-no-files-found: error

      - name: Build single-file application
        run: python -m PyInstaller --noconfirm --distpath dist-onefile --workpath build-ci-onefile Framio-onefile.spec

      - name: Verify single-file application
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist-onefile/Framio.exe')) { throw 'Single-file Framio.exe was not produced' }

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Framio-windows-single-file
          path: dist-onefile/Framio.exe
          if-no-files-found: error

      - name: Build lightweight single-file application
        run: python -m PyInstaller --noconfirm --distpath dist-lite --workpath build-ci-lite Framio-lite.spec

      - name: Verify lightweight single-file application
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist-lite/Framio.exe')) { throw 'Lightweight Framio.exe was not produced' }

      - name: Upload lightweight artifact
        uses: actions/upload-artifact@v4
        with:
          name: Framio-windows-single-file-lite
          path: dist-lite/Framio.exe
          if-no-files-found: error

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath 'dist/Framio-windows.zip' -Destination "release/Framio-$version-windows-portable.zip"
          Copy-Item -LiteralPath 'dist-onefile/Framio.exe' -Destination "release/Framio-$version-windows-single-file.exe"
          Copy-Item -LiteralPath 'dist-lite/Framio.exe' -Destination "release/Framio-$version-windows-lite.exe"

          $lines = @(Get-Content -LiteralPath 'CHANGELOG.md')
          $versionPattern = "^## \[$([regex]::Escape($version))\](?:\s|$)"
          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match $versionPattern) {
              $start = $index
              break
            }
          }
          if ($start -lt 0) { throw "CHANGELOG.md does not contain a section for version '$version'." }
          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## \[') {
              $end = $index
              break
            }
          }
          $notes = ($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim()
          Set-Content -LiteralPath 'release/release-notes.md' -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @files --title "Framio $env:GITHUB_REF_NAME" --notes-file 'release/release-notes.md' --latest
